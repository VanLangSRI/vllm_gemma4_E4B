# Gemma 4 E4B on one RTX 3090-class 24 GB card, containerized, batch mode.
#
#   docker compose up -d                 # builds, downloads the models, serves
#   docker compose run --rm prepare      # just download the models
#   docker compose run --rm batch verify # verify.sh inside the container
#
# Knobs go in a .env file next to this file (never committed): VLLM_API_KEY=...
# and any of the start-script variables (PORT, MODEL, MAX_LEN, MAX_SEQS,
# GPU_UTIL, INT8_ACT, PREFIX_CACHE, VISION, TOOLS, EXTRA_ARGS, ...) — .env is
# passed straight into the container.
#
# The model download lives in the ./models bind mount by default (MODELS_DIR)
# so a venv install and the container can share one copy.

x-gemma: &gemma
  image: gemma4-e4b-3090:latest
  build: .
  ipc: host
  env_file:
    - path: .env
      required: false
  environment:
    HOME: /cache
  volumes:
    - ${MODELS_DIR:-./models}:/app/models
    - gemma-cache:/cache

x-serve: &serve
  <<: *gemma
  ports:
    - "${PORT:-18030}:${PORT:-18030}"
  depends_on:
    prepare:
      condition: service_completed_successfully
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
  restart: unless-stopped
  stop_grace_period: 30s
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://127.0.0.1:${PORT:-18030}/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 600s   # first start: torch.compile + CUDA graph capture + FlashInfer JIT

services:
  prepare:
    <<: *gemma
    command: prepare

  batch:
    <<: *serve
    command: batch

volumes:
  gemma-cache:
